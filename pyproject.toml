[tool.poetry]
name = "arkanoid-game"
version = "2.3.0"  # Poetry формат: X.Y.Z (соответствует version.py: VERSION_MAJOR=2, VERSION_MINOR=3, VERSION_BUILD=0)
description = "Игра Арканоид"
authors = ["Developer <dadbarn@gmail.com>"]
readme = "README.MD"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
pygame = "^2.5.2"  # Установлено: 2.6.1, совместимо с ^2.5.2
numpy = "^2.1.0"  # Установлено: 2.3.5, совместимо с ^2.1.0
scikit-learn = "^1.7.2"  # Установлено: 1.7.2, совместимо с ^1.7.2

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"  # Установлено: 8.4.2, обновлено с ^7.0.0
mypy = "^1.10.0"
pyright = "^1.1.360"

[build-system]
requires = [
    "poetry-core",
    "setuptools>=45",
    "wheel",
    "setuptools-scm[toml]>=6.2"
]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
show_error_codes = true
ignore_missing_imports = true
exclude = [
    "src/",
    "scripts/",
    "resources/",
    "docs/",
    "tests/.*test_.*\\.py$",
]

[tool.pyright]
include = ["."]
exclude = [
    "**/src",
    "**/scripts",
    "**/resources",
    "**/docs",
    "**/__pycache__",
    "**/.*",
]
reportMissingImports = true
reportMissingTypeStubs = false
pythonVersion = "3.11"
typeCheckingMode = "basic"