[tool.poetry]
name = "arkanoid-game"
version = "2.1.5"
description = "Игра Арканоид"
authors = ["Developer <dadbarn@gmail.com>"]
readme = "README.md"
packages = [{include = "src"}]
repository = "https://github.com/LeraTheUnicorn/PygameArkanoid"
homepage = "https://github.com/LeraTheUnicorn/PygameArkanoid"

[tool.poetry.dependencies]
python = "^3.11"
pygame = "^2.5.2"
numpy = "^2.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
pyinstaller = "^6.0.0"

[build-system]
requires = [
    "poetry-core",
    "setuptools>=45",
    "wheel",
    "setuptools-scm[toml]>=6.2"
]
build-backend = "poetry.core.masonry.api"