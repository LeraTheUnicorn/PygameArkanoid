[tool.poetry]
name = "arkanoid-game"
version = "2.3.0"  # Poetry формат: X.Y.Z (соответствует version.py: VERSION_MAJOR=2, VERSION_MINOR=3, VERSION_BUILD=0)
description = "Игра Арканоид"
authors = ["Developer <dadbarn@gmail.com>"]
readme = "README.MD"
packages = [{include = "PygameArkanoid"}]

[tool.poetry.dependencies]
python = "^3.11"
pygame = "^2.5.2"  # Установлено: 2.6.1, совместимо с ^2.5.2
numpy = "^2.1.0"  # Установлено: 2.3.5, совместимо с ^2.1.0
scikit-learn = "^1.7.2"  # Установлено: 1.7.2, совместимо с ^1.7.2

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"  # Установлено: 8.4.2, обновлено с ^7.0.0

[build-system]
requires = [
    "poetry-core",
    "setuptools>=45",
    "wheel",
    "setuptools-scm[toml]>=6.2"
]
build-backend = "poetry.core.masonry.api"