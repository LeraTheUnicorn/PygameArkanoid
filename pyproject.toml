[tool.poetry]
name = "arkanoid-game"
version = "2.2"
description = "Игра Арканоид"
authors = ["Developer <dadbarn@gmail.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
pygame = "^2.5.2"
numpy = "^2.1.0"
scikit-learn = "^1.7.2"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"

[build-system]
requires = [
    "poetry-core",
    "setuptools>=45",
    "wheel",
    "setuptools-scm[toml]>=6.2"
]
build-backend = "poetry.core.masonry.api"