name: Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m venv .venv
        .venv\Scripts\activate
        pip install -r requirements.txt

    - name: Build package
      run: |
        .venv\Scripts\activate
        pip install build
        python -m build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  executables:
    runs-on: windows-latest
    strategy:
      matrix:
        os: [windows-latest]

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m venv .venv
        .venv\Scripts\activate
        pip install -r requirements.txt

    - name: Build executable (Linux/macOS)
      if: matrix.os != 'windows-latest'
      run: python build/create_executables.py

    - name: Install WiX Toolset (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        choco install wixtoolset

    - name: Build MSI installer (Windows)
      if: matrix.os == 'windows-latest'
      run: python build/create_msi.py

    - name: Upload executable artifacts (Linux/macOS)
      if: matrix.os != 'windows-latest'
      uses: actions/upload-artifact@v3
      with:
        name: executable-${{ matrix.os }}
        path: dist/

    - name: Upload MSI artifacts (Windows)
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: msi-installer
        path: "*.msi"

  release:
    needs: [build, executables]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Download executable artifacts (Windows)
      uses: actions/download-artifact@v4
      with:
        name: executable-windows-latest
        path: dist/

    - name: Download MSI installer
      uses: actions/download-artifact@v4
      with:
        name: msi-installer
        path: dist/

    - name: Generate release notes
      run: |
        # Extract changelog for current version
        VERSION=$(echo ${{ github.event.release.tag_name }} | sed 's/v//')
        awk "/## \[$VERSION\]/,/^## \[.*\] - .*/ { if (!/^## \[.*\] - .*/ || /^## \[$VERSION\]/) print; else exit }" docs/changelog.md > release_notes.md

    - name: Upload release assets
      uses: softprops/action-gh-release@v1
      with:
        files: dist/*
        body_path: release_notes.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}