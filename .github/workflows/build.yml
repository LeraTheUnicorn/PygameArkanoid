name: Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m venv .venv
        .venv\Scripts\activate
        pip install -r requirements.txt

    - name: Build package
      run: |
        .venv\Scripts\activate
        pip install build
        python -m build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  executables:
    runs-on: windows-latest
    strategy:
      matrix:
        os: [windows-latest]

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m venv .venv
        .venv\Scripts\activate
        pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install WiX Toolset (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        choco install wixtoolset --params "/ADD_WIX_TO_PATH"
        refreshenv || echo "refreshenv failed, continuing..."

    - name: Check WiX installation (Windows)
      if: matrix.os == 'windows-latest'
      shell: cmd
      run: |
        where candle.exe || echo "WiX candle.exe not found in PATH"
        where light.exe || echo "WiX light.exe not found in PATH"

    - name: Build executable (Windows)
      if: matrix.os == 'windows-latest'
      shell: cmd
      run: |
        .venv\Scripts\activate
        python build/create_executables.py

    - name: Build MSI installer (Windows)
      if: matrix.os == 'windows-latest'
      shell: cmd
      run: |
        .venv\Scripts\activate
        python build/create_msi.py || echo "MSI creation failed or skipped"

    - name: Upload executable artifacts (Windows)
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: executable-${{ matrix.os }}
        path: dist/

    - name: Upload MSI artifacts (Windows)
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: msi-installer
        path: "*.msi"
        if-no-files-found: ignore

  release:
    needs: [build, executables]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Download MSI installer
      uses: actions/download-artifact@v4
      with:
        name: msi-installer
        path: dist/

    - name: Download executable artifacts
      uses: actions/download-artifact@v4
      with:
        name: executable-windows-latest
        path: dist/

    - name: Generate release notes
      run: |
        # Extract changelog for current version
        VERSION=$(echo ${{ github.event.release.tag_name }} | sed 's/v//')
        awk "/## \[$VERSION\]/,/^## \[.*\] - .*/ { if (!/^## \[.*\] - .*/ || /^## \[$VERSION\]/) print; else exit }" docs/changelog.md > release_notes.md

    - name: Upload release assets
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/*.msi
          dist/Arkanoid.exe
        body_path: release_notes.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}